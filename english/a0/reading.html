<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading — A0 | Learning Bridge</title>
<link rel="stylesheet" href="../../style.css">
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('lb-theme') === 'light' ? 'light' : 'dark');
</script>
<style>
  .rd-wrap{ max-width:760px; margin:0 auto; padding:110px 20px 100px; }
  .rd-progress{ text-align:center; color:var(--ink-soft); font-size:.85rem; font-weight:700; margin-bottom:10px; }
  .rd-title{ text-align:center; font-size:1.4rem; font-weight:900; color:var(--ink); margin-bottom:22px; }

  .rd-audio-bar{
    display:flex; align-items:center; justify-content:center; gap:12px;
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:22px; flex-wrap:wrap;
  }
  .rd-audio-bar button{
    background:linear-gradient(135deg, var(--blue), var(--navy));
    color:#fff; border:none; border-radius:12px; padding:10px 18px;
    font-weight:800; font-size:.9rem; cursor:pointer;
  }
  .rd-audio-bar select{
    background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; font-size:.85rem;
  }

  .rd-text{
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:26px 22px; margin-bottom:26px;
    font-size:1.15rem; line-height:2.3; color:var(--ink);
    direction:ltr; text-align:left;
  }
  .rd-text .word{ cursor:pointer; border-radius:5px; padding:1px 2px; transition:background .15s ease; }
  .rd-text .word:hover{ background:rgba(59,130,246,0.18); }
  .rd-text .word-active{ background:var(--gold); color:#1a1a1a; }

  .word-panel{
    position:fixed; left:0; right:0; bottom:-100%; z-index:60;
    background:var(--paper); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:20px 22px 26px;
    box-shadow:var(--shadow-lg); transition:bottom .3s ease;
    max-width:760px; margin:0 auto;
  }
  .word-panel.open{ bottom:0; }
  .wp-close{
    display:block; margin-inline-start:auto; background:none; border:none;
    color:var(--ink-soft); font-size:1.2rem; cursor:pointer; margin-bottom:6px;
  }
  .wp-word{ direction:ltr; text-align:left; font-size:1.4rem; font-weight:900; color:var(--ink); }
  .wp-phonetic{ direction:ltr; text-align:left; color:var(--ink-soft); font-size:.9rem; margin:4px 0; }
  .wp-pos{
    display:inline-block; background:rgba(34,197,94,0.15); color:#4ade80;
    border-radius:999px; padding:3px 12px; font-size:.75rem; font-weight:700; margin-bottom:8px;
  }
  .wp-ar{ font-size:1.1rem; color:var(--ink); margin-bottom:14px; }
  .wp-listen{
    background:linear-gradient(135deg, var(--blue), var(--navy)); color:#fff; border:none;
    border-radius:12px; padding:10px 18px; font-weight:800; cursor:pointer; font-size:.9rem;
  }

  .rd-section-title{ font-weight:900; color:var(--ink); font-size:1.1rem; margin:30px 0 14px; }

  .q-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; }
  .q-label{ color:var(--ink); font-weight:700; margin-bottom:12px; }
  .q-options{ display:flex; flex-direction:column; gap:8px; }
  .q-opt{
    text-align:right; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:10px 14px; cursor:pointer; font-size:.92rem;
  }
  .q-opt.selected{ border-color:var(--blue); background:rgba(59,130,246,0.12); }
  .q-opt.correct{ border-color:#22c55e; background:rgba(34,197,94,0.18); }
  .q-opt.wrong{ border-color:#ef4444; background:rgba(239,68,68,0.18); }

  #btn-check-answers{
    display:block; width:100%; background:linear-gradient(135deg, var(--blue), var(--navy)); color:#fff;
    border:none; border-radius:12px; padding:13px; font-weight:800; cursor:pointer; margin-top:6px;
  }
  .score-result{ text-align:center; font-weight:800; margin-top:12px; min-height:1.2em; }
  .score-result.good{ color:#4ade80; }
  .score-result.mid{ color:var(--gold); }
  .score-result.warn{ color:#f87171; }

  .v-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .v-top{ display:flex; align-items:center; justify-content:space-between; direction:ltr; }
  .v-word{ font-weight:900; color:var(--ink); font-size:1.05rem; }
  .v-listen{ background:none; border:none; font-size:1.1rem; cursor:pointer; }
  .v-ph{ direction:ltr; text-align:left; color:var(--ink-soft); font-size:.82rem; margin-top:2px; }
  .v-ar{ color:var(--ink); font-weight:700; margin-top:6px; }
  .v-ex{ direction:ltr; text-align:left; color:var(--ink-soft); font-size:.85rem; margin-top:4px; font-style:italic; }

  #btn-next{
    display:block; width:100%; margin-top:30px; background:var(--paper); border:1px solid var(--blue);
    color:var(--blue); border-radius:14px; padding:15px; font-weight:800; cursor:pointer; font-size:1rem;
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="../../index.html" class="brand"><span class="dot"></span> Learning Bridge</a>
    <div class="nav-right">
      <button class="theme-toggle" data-theme-toggle aria-label="تبديل الوضع الداكن/الفاتح">🌙</button>
      <a href="index.html" class="nav-cta latin">A0 Skills</a>
    </div>
  </div>
</nav>

<div class="rd-wrap">
  <div class="rd-progress" id="progress-label"></div>
  <h1 class="rd-title" id="reading-title"></h1>

  <div class="rd-audio-bar">
    <button id="btn-toggle">🔊 استماع للنص</button>
    <select id="speed-select">
      <option value="0.7">بطيئة</option>
      <option value="1" selected>متوسطة</option>
      <option value="1.3">سريعة</option>
    </select>
  </div>

  <div class="rd-text" id="reading-text"></div>

  <div class="rd-section-title">📝 أسئلة الفهم</div>
  <div id="questions-container"></div>
  <button id="btn-check-answers">تحقق من إجاباتك</button>
  <div class="score-result" id="score-result"></div>

  <div class="rd-section-title">📚 Important Vocabulary</div>
  <div id="vocab-container"></div>

  <button id="btn-next">التالي ←</button>
</div>

<div class="word-panel" id="word-panel">
  <button class="wp-close" id="word-panel-close">✕</button>
  <div id="word-panel-content"></div>
</div>

<script src="reading-data.js"></script>
<script src="../../reading-engine.js"></script>
<script src="../../script.js"></script>
</body>
</html>
